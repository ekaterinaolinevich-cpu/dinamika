<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)" />
    <title>Динамика — анализы в одном месте</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312A594'/%3E%3Cpath d='M7 20l5-6 4 3 5-8 4 5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div class="boot" id="boot">
        <div class="boot__mark">
          <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
            <path d="M5 21l6-7 4.5 3.5L22 8l5 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="boot__text">Динамика</div>
      </div>

      <header class="topbar" id="topbar" hidden></header>
      <main class="view" id="view" hidden></main>
      <nav class="tabbar" id="tabbar" hidden></nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay__card">
        <div class="spinner"></div>
        <div class="overlay__text" id="overlay-text">Читаю бланк…</div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
